<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PetShop - Catálogo</title>
</head>
<body>
    <header>
        <h1>PetShop - Catálogo de Productos</h1>
        <nav>
            <a href="/products">Products</a> | 
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <hr>
    <h2>Nuestros Productos</h2>
    <ul>
        {% for p in products %}
            <li>
                <strong>{{ p.name }}</strong> - {{ p.price }} 
                <button onclick="alert('¡Producto agregado al carrito!')">Agregar al carrito</button>
            </li>
            <br>
        {% endfor %}
    </ul>
</body>
</html>
