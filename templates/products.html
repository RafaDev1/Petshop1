<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Productos</title>

<style>

body{
    margin:0;
    background:#f4f4f4;
    font-family:Arial;
}

nav{
    background:#6b7280;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-right:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.price{
    color:#2563eb;
    font-weight:bold;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#6b7280;
    color:white;
    cursor:pointer;
}

</style>

</head>

<body>

<nav>
/productsProducts</a>
/logoutLogout</a>
</nav>

<div class="grid">

{% for p in products %}

<div class="card">

<h3>{{ p.name }}</h3>

<p class="price">{{ p.price }}</p>

<button>
Agregar al carrito
</button>

</div>

{% endfor %}

</div>

</body>
</html>
