<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PetShop Login</title>

<style>

*{
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1976d2,#42a5f5);
}

.card{
    width:420px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    text-align:center;
}

h1{
    color:#1976d2;
}

p{
    color:#666;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    border:none;
    padding:15px;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

.error{
    color:red;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="card">

    <h1>🐾 PetShop</h1>

    <p>Plataforma de productos para mascotas</p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    /login

        <input
            type="text"
            name="username"
            placeholder="Usuario"
            required>

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required>

        <button type="submit">
            Iniciar Sesión
        </button>

    </form>

</div>

</body>

</html>
