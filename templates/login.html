<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Iniciar Sesión</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            background:
                linear-gradient(
                    rgba(0,0,0,.4),
                    rgba(0,0,0,.4)
                ),
                url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b');
            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:420px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.35);
            text-align:center;
        }

        .logo{
            width:120px;
            margin-bottom:15px;
        }

        h1{
            color:#1976d2;
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#1976d2;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0d5ab9;
        }

    </style>
</head>

<body>

    <div class="login-card">

        https://cdn-icons-png.flaticon.com/512/616/616408.png

        <h1>PetShop</h1>

        <p>Plataforma de productos para mascotas</p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Usuario"
                required>

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
                required>

            <button type="submit">
                Iniciar Sesión
            </button>

        </form>

    </div>

</body>
</html>
