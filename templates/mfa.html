<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MFA</title>
</head>
<body>
<h2>Verificación MFA</h2>
<form action="/verify" method="post">
<label>Código MFA</label><br>
<input type="text" name="otp" maxlength="6" pattern="[0-9]{6}" required><br><br>
<button type="submit">Validar</button>
</form>
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
</body>
</html>
