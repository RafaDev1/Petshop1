<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>PetShop - MFA</title>

<style>

body{

    margin:0;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#f4f7fb;

    font-family:'Segoe UI',sans-serif;
}

.card{

    width:420px;

    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,.15);
}

h2{

    color:#1976d2;
}

p{

    color:#666;

    margin-bottom:20px;
}

input{

    width:100%;

    padding:15px;

    border:1px solid #ddd;
    border-radius:10px;
}

button{

    margin-top:15px;

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#4CAF50;

    color:white;

    font-size:18px;

    cursor:pointer;
}

button:hover{

    background:#388e3c;
}

</style>

</head>

<body>

<div class="card">

    <h2>🔐 Verificación MFA</h2>

    <p>
        Ingrese el código generado por Google Authenticator
    </p>
    {% if error %}
    <p style="color:red;">
        {{ error }}
    </p>
    {% endif %}

    /verify

        <input
            type="text"
            name="code"
            placeholder="Código de 6 dígitos"
            maxlength="6"
            required>

        <button type="submit">
            Validar Código
        </button>

    </form>

</div>

</body>
</html>
