<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PetShop - Autenticación MFA</title>
</head>
<body>
    <h2>Verificación de Doble Factor (MFA)</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form action="/verify" method="POST">
        <div>
            <label>Código de Google Authenticator (6 dígitos):</label><br>
            <input type="text" name="otp_code" pattern="[0-9]{6}" maxlength="6" required>
        </div>
        <br>
        <button type="submit">Verificar Código</button>
    </form>
</body>
</html>
